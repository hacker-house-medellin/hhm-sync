[package]
name = "hhm-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "opto-sync/syncer.rs JSON reconciliation gateway for Hacker House Medellín."
repository = "https://github.com/hacker-house-medellin/hhm-sync"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
oresoftware-next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "ca176fb6768a9750d262a536952268625ffd3a8a" }
syncer-rs = { git = "https://github.com/opto-sync/syncer.rs", rev = "946e23b0729c92ab3b4cadec8d4fbd540b663dd8" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
